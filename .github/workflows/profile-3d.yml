name: GitHub Profile 3D Contrib

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contrib
        uses: yuygfgg/github-profile-3d-contrib@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Tusharkapoor-oop
        with:
          USERNAME: Tusharkapoor-oop
          MAX_REPOS: 20

      - name: Commit 3D profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/ || true
          git diff --cached --quiet || git commit -m "chore: update 3d contrib [skip ci]"
          git push origin HEAD:main || true
