<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Tushar Kapoor - AI/ML Engineer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#04040c"/>
    <stop offset="0.55" stop-color="#0a0a1e"/>
    <stop offset="1" stop-color="#12082b"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4f46e5" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#4f46e5" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee">
      <animate attributeName="stop-color" values="#22d3ee;#818cf8;#c084fc;#818cf8;#22d3ee" dur="9s" repeatCount="indefinite"/>
    </stop>
    <stop offset="0.5" stop-color="#818cf8">
      <animate attributeName="stop-color" values="#818cf8;#c084fc;#22d3ee;#c084fc;#818cf8" dur="9s" repeatCount="indefinite"/>
    </stop>
    <stop offset="1" stop-color="#c084fc">
      <animate attributeName="stop-color" values="#c084fc;#22d3ee;#818cf8;#22d3ee;#c084fc" dur="9s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <radialGradient id="orbA" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#06b6d4" stop-opacity="0.4"/>
    <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orbC" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#a855f7" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0v40" fill="none" stroke="#1e1b4b" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
</defs>

<rect width="1200" height="340" fill="url(#bg)"/>
<rect width="1200" height="340" fill="url(#grid)" opacity="0.55"/>

<rect x="-340" width="340" height="340" fill="url(#sweep)" opacity="0.7">
  <animate attributeName="x" values="-340;1200" dur="7s" repeatCount="indefinite"/>
</rect>

<circle cx="960" cy="66" r="132" fill="url(#orbA)" filter="url(#soft)">
  <animate attributeName="opacity" values="0.75;0.4;0.75" dur="7s" repeatCount="indefinite"/>
</circle>
<circle cx="140" cy="306" r="108" fill="url(#orbB)" filter="url(#soft)">
  <animate attributeName="opacity" values="0.5;0.85;0.5" dur="6s" repeatCount="indefinite"/>
</circle>
<circle cx="620" cy="330" r="96" fill="url(#orbC)" filter="url(#soft)">
  <animate attributeName="opacity" values="0.4;0.7;0.4" dur="8s" repeatCount="indefinite"/>
</circle>

<g stroke="#312e81" stroke-width="1.5" fill="none">
  <line x1="0" y1="288" x2="1200" y2="288" stroke-dasharray="16 10">
    <animate attributeName="stroke-dashoffset" values="0;-52" dur="3.2s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="308" x2="1200" y2="308" stroke-dasharray="26 16">
    <animate attributeName="stroke-dashoffset" values="0;-84" dur="4.4s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="330" x2="1200" y2="330" stroke-dasharray="38 22">
    <animate attributeName="stroke-dashoffset" values="0;-120" dur="6s" repeatCount="indefinite"/>
  </line>
</g>

<g stroke="#312e81" stroke-width="1">
  <line x1="770" y1="64" x2="910" y2="100"/>
  <line x1="770" y1="64" x2="910" y2="172"/>
  <line x1="770" y1="64" x2="910" y2="244"/>
  <line x1="770" y1="136" x2="910" y2="100"/>
  <line x1="770" y1="136" x2="910" y2="172"/>
  <line x1="770" y1="136" x2="910" y2="244"/>
  <line x1="770" y1="208" x2="910" y2="100"/>
  <line x1="770" y1="208" x2="910" y2="172"/>
  <line x1="770" y1="208" x2="910" y2="244"/>
  <line x1="770" y1="280" x2="910" y2="100"/>
  <line x1="770" y1="280" x2="910" y2="172"/>
  <line x1="770" y1="280" x2="910" y2="244"/>
  <line x1="910" y1="100" x2="1050" y2="136"/>
  <line x1="910" y1="100" x2="1050" y2="208"/>
  <line x1="910" y1="172" x2="1050" y2="136"/>
  <line x1="910" y1="172" x2="1050" y2="208"/>
  <line x1="910" y1="244" x2="1050" y2="136"/>
  <line x1="910" y1="244" x2="1050" y2="208"/>
  <line x1="1050" y1="136" x2="1150" y2="172"/>
  <line x1="1050" y1="208" x2="1150" y2="172"/>
</g>

<g stroke="#818cf8" stroke-width="1.4" fill="none" stroke-dasharray="5 9" opacity="0.85">
  <line x1="770" y1="64" x2="910" y2="172">
    <animate attributeName="stroke-dashoffset" values="14;0" dur="1.1s" repeatCount="indefinite"/>
  </line>
  <line x1="770" y1="136" x2="910" y2="172">
    <animate attributeName="stroke-dashoffset" values="14;0" dur="1.3s" repeatCount="indefinite"/>
  </line>
  <line x1="770" y1="208" x2="910" y2="172">
    <animate attributeName="stroke-dashoffset" values="14;0" dur="1.05s" repeatCount="indefinite"/>
  </line>
  <line x1="770" y1="280" x2="910" y2="244">
    <animate attributeName="stroke-dashoffset" values="14;0" dur="1.4s" repeatCount="indefinite"/>
  </line>
  <line x1="910" y1="100" x2="1050" y2="136">
    <animate attributeName="stroke-dashoffset" values="14;0" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <line x1="910" y1="172" x2="1050" y2="136">
    <animate attributeName="stroke-dashoffset" values="14;0" dur="1.15s" repeatCount="indefinite"/>
  </line>
  <line x1="910" y1="244" x2="1050" y2="208">
    <animate attributeName="stroke-dashoffset" values="14;0" dur="1.35s" repeatCount="indefinite"/>
  </line>
  <line x1="1050" y1="136" x2="1150" y2="172">
    <animate attributeName="stroke-dashoffset" values="14;0" dur="1s" repeatCount="indefinite"/>
  </line>
</g>

<g fill="#c7d2fe">
  <circle cx="770" cy="64" r="4"><animate attributeName="r" values="4;5.6;4" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="770" cy="136" r="4"><animate attributeName="r" values="4;5.6;4" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
  <circle cx="770" cy="208" r="4"><animate attributeName="r" values="4;5.6;4" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
  <circle cx="770" cy="280" r="4"><animate attributeName="r" values="4;5.6;4" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
  <circle cx="910" cy="100" r="4"><animate attributeName="r" values="4;5.6;4" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
  <circle cx="910" cy="172" r="4.5"><animate attributeName="r" values="4.5;6.4;4.5" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="910" cy="244" r="4"><animate attributeName="r" values="4;5.6;4" dur="2.4s" begin="2s" repeatCount="indefinite"/></circle>
  <circle cx="1050" cy="136" r="4.5"><animate attributeName="r" values="4.5;6.2;4.5" dur="2.2s" begin="0.3s" repeatCount="indefinite"/></circle>
  <circle cx="1050" cy="208" r="4.5"><animate attributeName="r" values="4.5;6.2;4.5" dur="2.2s" begin="1.1s" repeatCount="indefinite"/></circle>
</g>

<g fill="#22d3ee">
  <circle r="3" opacity="0.95">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M770,64 L910,172 L1050,136 L1150,172"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#c084fc" opacity="0.95">
    <animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite" path="M770,280 L910,244 L1050,208 L1150,172"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.6" fill="#e2e8f0" opacity="0.95">
    <animateMotion dur="2.6s" begin="1.7s" repeatCount="indefinite" path="M770,136 L910,100 L1050,136 L1150,172"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" begin="1.7s" repeatCount="indefinite"/>
  </circle>
</g>

<circle cx="1150" cy="172" r="8" fill="url(#neon)" filter="url(#glow)"/>
<circle cx="1150" cy="172" r="9" fill="none" stroke="#22d3ee" stroke-width="1.5">
  <animate attributeName="r" values="9;30" dur="2.4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.9;0" dur="2.4s" repeatCount="indefinite"/>
</circle>
<circle cx="1150" cy="172" r="9" fill="none" stroke="#818cf8" stroke-width="1.5">
  <animate attributeName="r" values="9;30" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.9;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
</circle>

<g fill="none" stroke="url(#neon)" stroke-width="2">
  <path d="M36,64 V36 H78"/>
  <path d="M1122,36 H1164 V64"/>
  <path d="M1164,276 V304 H1122"/>
  <path d="M78,304 H36 V276"/>
</g>

<g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <text x="64" y="132" font-size="56" font-weight="800" letter-spacing="3" fill="url(#neon)" filter="url(#glow)">TUSHAR KAPOOR</text>
  <text x="66" y="170" font-size="13.5" letter-spacing="3.4" fill="#94a3b8">AI / ML ENGINEER &#183; COMPUTER VISION &#183; INTELLIGENT SYSTEMS</text>
  <text x="66" y="200" font-size="13" letter-spacing="1.6" fill="#64748b" font-family="Consolas,'Cascadia Code',monospace">python &#8212; pytorch &#8212; opencv &#8212; fastapi &#8212; agents &#8212; cloud</text>
</g>

<circle cx="70" cy="238" r="3.5" fill="#34d399">
  <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
</circle>
<text x="84" y="242" font-size="12" fill="#64748b" font-family="Consolas,'Cascadia Code',monospace">building real-time multimodal systems</text>
</svg>
