<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TUSHAR KAPOOR: UNIVERSE</title>
  <meta name="description" content="Tushar Kapoor — AI/ML engineer. One repository, one planet: a live galaxy star map of real GitHub work." />
  <meta property="og:title" content="TUSHAR KAPOOR: UNIVERSE" />
  <meta property="og:description" content="A live galaxy map of Tushar Kapoor's GitHub repositories — AI/ML, vision, systems." />
  <meta property="og:type" content="website" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#02030a" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <canvas id="universe"></canvas>
    <div id="loading">
      <div class="loading-text">INITIALIZING STAR MAP</div>
    </div>
    <div id="hero" class="hidden">
      <h1>TUSHAR KAPOOR</h1>
      <p class="subtitle">B.Tech CSE (AI & ML)</p>
      <p class="tagline">AI / ML · SOFTWARE · DATA · SYSTEMS</p>
    </div>
    <div id="hud" class="hidden">
      <div class="hud-top-left">
        <div class="hud-label">TUSHAR KAPOOR: UNIVERSE</div>
        <div class="hud-sublabel" id="data-source">LOADING...</div>
      </div>
      <div class="hud-bottom-right">
        <div class="hud-label">NAVIGATION</div>
        <div class="hud-nav">
          <span>Click planet to explore</span>
          <span>ESC to return</span>
          <span>Scroll to travel</span>
        </div>
      </div>
    </div>
    <div id="planet-panel" class="hidden">
      <button id="panel-close">✕</button>
      <div class="panel-content">
        <div class="panel-classification" id="panel-class"></div>
        <h2 id="panel-name"></h2>
        <p id="panel-desc"></p>
        <div class="panel-metrics" id="panel-metrics"></div>
        <div class="panel-topics" id="panel-topics"></div>
        <a id="panel-link" href="#" target="_blank" rel="noopener">View Repository</a>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
